<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saisie — Suivi migraines</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0f1117;color:#fff;font-family:'DM Sans',sans-serif;min-height:100vh;padding:0 0 60px;}
.header{background:#0d1629;padding:20px 20px 16px;margin-bottom:8px;}
.header-title{font-size:18px;font-weight:500;color:#fff;}
.header-sub{font-size:12px;color:#82B2C0aa;margin-top:3px;}
.back-link{font-size:13px;color:#82B2C088;text-decoration:none;display:inline-block;margin-top:4px;}
.back-link:hover{color:#82B2C0;}
.form{max-width:480px;margin:0 auto;padding:0 16px;}
.card{background:#1a1e2e;border:0.5px solid #ffffff08;border-radius:12px;padding:18px 16px;margin-bottom:8px;}
.question{font-size:14px;color:#fff;font-weight:500;margin-bottom:12px;line-height:1.4;}
.question span{color:#82B2C0;}
.sublabel{font-size:12px;color:#555;margin-bottom:8px;}
input[type="time"],input[type="date"],input[type="number"],input[type="text"]{background:#0f1117;border:0.5px solid #ffffff15;border-radius:8px;padding:10px 14px;font-size:15px;color:#fff;width:100%;outline:none;font-family:'DM Sans',sans-serif;-webkit-appearance:none;}
input:focus{border-color:#82B2C066;}
.btn-group{display:grid;gap:8px;}
.btn-group.cols2{grid-template-columns:1fr 1fr;}
.btn-group.cols3{grid-template-columns:1fr 1fr 1fr;}
.btn-group.cols5{grid-template-columns:repeat(5,1fr);}
.btn-opt{background:#0f1117;border:0.5px solid #ffffff15;border-radius:8px;padding:10px 8px;font-size:12px;color:#aaa;cursor:pointer;text-align:center;transition:all 0.15s;font-family:'DM Sans',sans-serif;}
.btn-opt.selected{background:#0a2535;border-color:#82B2C0;color:#C3DEDD;}
.checkbox-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.checkbox-item{display:flex;align-items:center;gap:10px;background:#0f1117;border:0.5px solid #ffffff15;border-radius:8px;padding:10px 12px;cursor:pointer;transition:all 0.15s;}
.checkbox-item.checked{background:#0a2535;border-color:#82B2C0;}
.checkbox-item input{display:none;}
.checkbox-box{width:18px;height:18px;border-radius:4px;border:1.5px solid #333;background:#0f1117;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.15s;}
.checkbox-item.checked .checkbox-box{background:#82B2C0;border-color:#82B2C0;}
.checkbox-check{color:#0d1629;font-size:12px;font-weight:700;display:none;}
.checkbox-item.checked .checkbox-check{display:block;}
.checkbox-label{font-size:13px;color:#aaa;}
.checkbox-item.checked .checkbox-label{color:#C3DEDD;}
.submit-btn{background:#82B2C0;border:none;border-radius:10px;padding:14px;font-size:14px;font-weight:500;color:#0d1629;width:100%;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:6px;transition:background 0.2s;}
.submit-btn:hover{background:#6fa0af;}
.submit-btn:disabled{background:#333;color:#666;cursor:not-allowed;}
.section-title{font-size:11px;color:#555;text-transform:uppercase;letter-spacing:0.08em;margin:20px 0 8px;padding-left:2px;}
.mode-choice{display:grid;gap:12px;margin-bottom:8px;}
.mode-card{background:#1a1e2e;border:0.5px solid #ffffff10;border-radius:14px;padding:20px;cursor:pointer;transition:all 0.15s;}
.mode-card:hover{border-color:#82B2C066;}
.mode-card-title{font-size:16px;font-weight:500;color:#fff;margin-bottom:4px;}
.mode-card-sub{font-size:12px;color:#666;line-height:1.5;}
.episode-item{background:#1a1e2e;border:0.5px solid #ffffff10;border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:all 0.15s;}
.episode-item:hover{border-color:#82B2C066;}
.episode-info{font-size:13px;color:#ccc;}
.episode-sub{font-size:11px;color:#555;margin-top:2px;}
.badge{font-size:10px;padding:3px 8px;border-radius:6px;font-weight:500;}
.badge.open{background:#0f2535;color:#82B2C0;}
.badge.closed{background:#1e2235;color:#555;}
.saved-flag{font-size:11px;color:#8FBF7A;margin-top:6px;display:none;}
.saved-flag.show{display:block;}
.error-box{background:#2a1010;border:0.5px solid #D85A3044;border-radius:10px;padding:12px 14px;font-size:13px;color:#F09595;margin-top:8px;display:none;}
.error-box.show{display:block;}
.loading{text-align:center;padding:40px 0;color:#555;font-size:13px;}
.selected-episode-banner{background:#0d1629;border-radius:12px;padding:14px 16px;margin-bottom:12px;font-size:13px;color:#82B2C0;}
.filled-tag{font-size:10px;color:#8FBF7A;margin-left:6px;}
</style>
</head>
<body>

<div class="header">
  <a href="index.html" class="back-link">← Retour au dashboard</a>
  <div class="header-title" id="page-title">Suivi migraines</div>
  <div class="header-sub" id="page-sub"></div>
</div>

<div class="form" id="root"></div>

<script>
/* ===================== CONFIGURATION ===================== */
const WORKER_URL = 'https://suivi-migraines.dashboard-suivi.workers.dev'; // Worker Cloudflare (lecture)
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxQY5pnlJPYTXrMm6T7wl87SshdAmJwygaYkMiisANG4DrhOk_cuQ7V_2B6gJ894ltskw/exec'; // Apps Script (écriture)

/* Listes de référence (issues de l'onglet "Liste référence") */
const MEDICAMENTS = ['Doliprane 500mg','Doliprane 1000mg','Ipraféine 500mg','Tramadol 50mg','Ibuprofène','Dalféine','Aucun'];
const DECLENCHEURS = ['Fatigue','Sur-stimulation','Écran prolongé','Lunettes non portées','Déshydratation','Lumière vive','Bruits forts','Cycle menstruel','Météo','Effort physique','Traitement MPH','Inconnu','Aucun'];
const LOCALISATIONS = ['Unilatérale (droit)','Unilatérale (gauche)','Bilatérale','Frontale','Temporale','Orbitale','Diffuse'];
const EFFICACITE_CATEGORIES = [
  "Excellente - 100% douleur disparue en < 1h",
  "Bonne - 100% douleur disparue en 1 à 2h",
  "Partielle - entre 50 et 100% douleur disparue en 0 à 2h",
  "Nulle - pas d'amélioration significative après 2 à 3h"
];
const EFFICACITE_PCT = ['0%','25%','50%','75%','100%'];
const DELAI_EFFET = [{l:'0,5h',v:0.5},{l:'1h',v:1},{l:'1,5h',v:1.5},{l:'2h',v:2},{l:'2,5h',v:2.5},{l:'3h et +',v:3}];
/* Échelle d'intensité 1 à 5 — libellés à ajuster si besoin, aucun épisode à 5 observé pour l'instant */
const INTENSITE = [{v:1,l:'1 · Légère'},{v:2,l:'2 · Modérée'},{v:3,l:'3 · Forte'},{v:4,l:'4 · Sévère'},{v:5,l:'5 · Extrême'}];

const SYMPTOMES_FIELDS = [
  {key:'Sens._lumière', label:'Sensibilité à la lumière'},
  {key:'Sens._bruit', label:'Sensibilité au bruit'},
  {key:'Sens._vestib', label:'Sensibilité vestibulaire'},
  {key:'Fatigue', label:'Fatigue'},
  {key:'Auras', label:'Aura'},
  {key:'Vertiges', label:'Vertiges'},
  {key:'Acc._difficile', label:'Accommodation difficile'}
];
const SOLUTIONS_FIELDS = [
  {key:'Lum._reduite', label:'Lumière réduite'},
  {key:'Isolement_noir', label:'Isolement dans le noir'},
  {key:'Limit._ecrans', label:'Limitation des écrans'},
  {key:'Sortie_ext', label:'Sortie extérieure'},
  {key:'Sommeil', label:'Sommeil'},
  {key:'Douche', label:'Douche'},
  {key:'Port_lunettes', label:'Port des lunettes'},
  {key:'Medicament', label:'Médicament pris'}
];

/* ===================== STATE ===================== */
let view = 'menu'; // 'menu' | 'nouveau' | 'liste' | 'completer'
let episodesCache = null;
let selectedEpisode = null; // objet {suivi, symptomes, solutions}
let newEpisodeState = { localisation: [], declencheurs: [], symptomes: {} };

/* ===================== HELPERS ===================== */
function todayStr(){
  const d = new Date();
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
}
function nowStr(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function dateInputToFr(v){ // "2026-08-03" -> "03/08/2026"
  if(!v) return '';
  const p = v.split('-'); return p[2]+'/'+p[1]+'/'+p[0];
}
function frToDateInput(v){ // "03/08/2026" -> "2026-08-03"
  if(!v) return '';
  const p = String(v).split('/'); if(p.length<3) return '';
  return p[2]+'-'+p[1]+'-'+p[0];
}
function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  if(t.content.children.length > 1){
    // Un template avec plusieurs éléments racines : on les regroupe dans un wrapper
    // "transparent" (display:contents) pour ne perdre aucun élément ni casser la mise en page.
    const wrapper = document.createElement('div');
    wrapper.style.display = 'contents';
    while(t.content.firstChild) wrapper.appendChild(t.content.firstChild);
    return wrapper;
  }
  return t.content.firstChild;
}

async function fetchSheet(sheetName){
  const r = await fetch(WORKER_URL + '?sheet=' + encodeURIComponent(sheetName));
  if(!r.ok) throw new Error('Erreur ' + r.status);
  const d = await r.json();
  if(d.error) throw new Error(d.error.message || 'Erreur de lecture');
  if(!d.values || d.values.length < 2) return [];
  const [headers, ...rows] = d.values;
  return rows.map(row => { const o = {}; headers.forEach((h,i)=>o[h.trim()]=row[i]||''); return o; });
}

async function loadEpisodes(){
  const [suivi, symptomes, solutions] = await Promise.all([
    fetchSheet('Suivi'), fetchSheet('Symptômes'), fetchSheet('Solutions')
  ]);
  const symById = {}; symptomes.forEach(r => symById[r.ID_episode] = r);
  const solById = {}; solutions.forEach(r => solById[r.ID_episode] = r);
  return suivi
    .filter(r => r.ID_episode !== '')
    .map(r => ({ suivi: r, symptomes: symById[r.ID_episode] || {}, solutions: solById[r.ID_episode] || {} }))
    .sort((a,b) => Number(b.suivi.ID_episode) - Number(a.suivi.ID_episode));
}

async function postAction(payload){
  const r = await fetch(SCRIPT_URL, {
    method: 'POST',
    headers: {'Content-Type':'text/plain;charset=utf-8'}, // évite le preflight CORS qu'Apps Script ne gère pas ; le contenu reste du JSON (parsé côté serveur)
    body: JSON.stringify(payload)
  });
  const d = await r.json();
  if(!d.ok) throw new Error(d.error || 'Erreur inconnue');
  return d.result;
}

/* ===================== RENDER : MENU ===================== */
function renderMenu(){
  document.getElementById('page-title').textContent = 'Suivi migraines';
  document.getElementById('page-sub').textContent = '';
  const root = document.getElementById('root');
  root.innerHTML = '';
  root.appendChild(el(`
    <div class="mode-choice">
      <div class="mode-card" id="btn-nouveau">
        <div class="mode-card-title">🩹 Nouvel épisode</div>
        <div class="mode-card-sub">Une migraine commence maintenant — tu notes juste l'heure de début (et éventuellement quelques symptômes tout de suite).</div>
      </div>
      <div class="mode-card" id="btn-completer">
        <div class="mode-card-title">✏️ Compléter un épisode</div>
        <div class="mode-card-sub">Ajouter une prise, des symptômes, des solutions ou clôturer un épisode déjà ouvert.</div>
      </div>
    </div>
  `));
  document.getElementById('btn-nouveau').onclick = () => { view = 'nouveau'; renderNouveau(); };
  document.getElementById('btn-completer').onclick = () => { view = 'liste'; renderListe(); };
}

/* ===================== RENDER : NOUVEL ÉPISODE ===================== */
function renderNouveau(){
  document.getElementById('page-title').textContent = 'Nouvel épisode';
  document.getElementById('page-sub').textContent = todayStr();
  const root = document.getElementById('root');
  root.innerHTML = '';
  root.appendChild(el('<a href="#" id="back-menu" class="back-link">← Retour</a>'));
  document.getElementById('back-menu').onclick = (e)=>{e.preventDefault(); view='menu'; renderMenu();};

  root.appendChild(el(`
    <div class="card">
      <div class="question">Date de début</div>
      <input type="date" id="f_date_debut" value="${new Date().toISOString().slice(0,10)}"/>
    </div>
  `));

  root.appendChild(el(`
    <div class="card">
      <div class="question">Heure de début</div>
      <input type="time" id="f_heure_debut" value="${nowStr()}"/>
    </div>
  `));

  root.appendChild(el(`
    <div class="card">
      <div class="question">Localisation de la douleur <span>(optionnel, coche ce que tu sais déjà)</span></div>
      <div class="checkbox-grid" id="grid-localisation"></div>
    </div>
  `));
  buildCheckboxGrid('grid-localisation', LOCALISATIONS, newEpisodeState.localisation);

  root.appendChild(el(`
    <div class="card">
      <div class="question">Facteur déclencheur principal <span>(optionnel)</span></div>
      <div class="checkbox-grid" id="grid-declencheurs"></div>
    </div>
  `));
  buildCheckboxGrid('grid-declencheurs', DECLENCHEURS, newEpisodeState.declencheurs);

  root.appendChild(el(`
    <div class="card">
      <div class="question">Symptômes déjà présents <span>(optionnel)</span></div>
      <div class="checkbox-grid" id="grid-symptomes-new"></div>
    </div>
  `));
  buildSymptomesGrid('grid-symptomes-new', newEpisodeState.symptomes);

  const btn = el('<button class="submit-btn">Ouvrir cet épisode</button>');
  const errBox = el('<div class="error-box"></div>');
  root.appendChild(btn); root.appendChild(errBox);

  btn.onclick = async () => {
    btn.disabled = true; btn.textContent = 'Enregistrement…';
    errBox.classList.remove('show');
    try{
      const dateDebut = document.getElementById('f_date_debut').value;
      const heure = document.getElementById('f_heure_debut').value;
      const suivi = {
        Date_debut: dateInputToFr(dateDebut),
        Heure_debut: heure
      };
      if(newEpisodeState.localisation.length) suivi['Localisation_douleur'] = newEpisodeState.localisation.join(', ');
      if(newEpisodeState.declencheurs.length) suivi['Facteur_declencheur_princ.'] = newEpisodeState.declencheurs.join(', ');

      const symptomes = {};
      SYMPTOMES_FIELDS.forEach(f => symptomes[f.key] = !!newEpisodeState.symptomes[f.key]);

      const result = await postAction({ action:'create', suivi, symptomes });
      episodesCache = null; // invalider le cache de liste
      selectedEpisode = { suivi: Object.assign({ID_episode: result.id_episode}, suivi), symptomes, solutions: {} };
      view = 'completer';
      renderCompleter(true);
    } catch(err){
      errBox.textContent = 'Erreur : ' + err.message;
      errBox.classList.add('show');
      btn.disabled = false; btn.textContent = 'Ouvrir cet épisode';
    }
  };
}

function buildCheckboxGrid(containerId, values, stateArray){
  const grid = document.getElementById(containerId);
  values.forEach(v => {
    const checked = stateArray.includes(v);
    const item = el(`
      <label class="checkbox-item ${checked?'checked':''}">
        <input type="checkbox" value="${v}" ${checked?'checked':''}/>
        <div class="checkbox-box"><span class="checkbox-check">✓</span></div>
        <span class="checkbox-label">${v}</span>
      </label>
    `);
    item.onclick = () => {
      setTimeout(()=>{
        const input = item.querySelector('input');
        item.classList.toggle('checked', input.checked);
        const idx = stateArray.indexOf(v);
        if(input.checked && idx === -1) stateArray.push(v);
        if(!input.checked && idx !== -1) stateArray.splice(idx,1);
      },0);
    };
    grid.appendChild(item);
  });
}

function buildSymptomesGrid(containerId, stateObj){
  const grid = document.getElementById(containerId);
  SYMPTOMES_FIELDS.forEach(f => {
    const checked = !!stateObj[f.key];
    const item = el(`
      <label class="checkbox-item ${checked?'checked':''}">
        <input type="checkbox" ${checked?'checked':''}/>
        <div class="checkbox-box"><span class="checkbox-check">✓</span></div>
        <span class="checkbox-label">${f.label}</span>
      </label>
    `);
    item.onclick = () => {
      setTimeout(()=>{
        const input = item.querySelector('input');
        item.classList.toggle('checked', input.checked);
        stateObj[f.key] = input.checked;
      },0);
    };
    grid.appendChild(item);
  });
}

/* ===================== RENDER : LISTE DES ÉPISODES ===================== */
async function renderListe(){
  document.getElementById('page-title').textContent = 'Compléter un épisode';
  document.getElementById('page-sub').textContent = '';
  const root = document.getElementById('root');
  root.innerHTML = '';
  root.appendChild(el('<a href="#" id="back-menu" class="back-link">← Retour</a>'));
  document.getElementById('back-menu').onclick = (e)=>{e.preventDefault(); view='menu'; renderMenu();};
  root.appendChild(el('<div class="loading">Chargement des épisodes…</div>'));

  try{
    if(!episodesCache) episodesCache = await loadEpisodes();
    root.innerHTML = '';
    root.appendChild(el('<a href="#" id="back-menu2" class="back-link">← Retour</a>'));
    document.getElementById('back-menu2').onclick = (e)=>{e.preventDefault(); view='menu'; renderMenu();};

    if(!episodesCache.length){
      root.appendChild(el('<div class="loading">Aucun épisode enregistré pour l\'instant.</div>'));
      return;
    }

    episodesCache.forEach(ep => {
      const isOpen = !ep.suivi.Date_fin;
      const item = el(`
        <div class="episode-item">
          <div>
            <div class="episode-info">Épisode #${ep.suivi.ID_episode} — ${ep.suivi.Date_debut} ${ep.suivi.Heure_debut}</div>
            <div class="episode-sub">${ep.suivi.Localisation_douleur || 'Localisation non précisée'}</div>
          </div>
          <span class="badge ${isOpen?'open':'closed'}">${isOpen?'En cours':'Clôturé'}</span>
        </div>
      `);
      item.onclick = () => { selectedEpisode = ep; view = 'completer'; renderCompleter(false); };
      root.appendChild(item);
    });
  } catch(err){
    root.innerHTML = '';
    root.appendChild(el('<a href="#" id="back-menu3" class="back-link">← Retour</a>'));
    document.getElementById('back-menu3').onclick = (e)=>{e.preventDefault(); view='menu'; renderMenu();};
    root.appendChild(el('<div class="error-box show">Erreur de chargement : '+err.message+'</div>'));
  }
}

/* ===================== RENDER : COMPLÉTER UN ÉPISODE ===================== */
function renderCompleter(justCreated){
  const ep = selectedEpisode;
  document.getElementById('page-title').textContent = 'Épisode #' + ep.suivi.ID_episode;
  document.getElementById('page-sub').textContent = ep.suivi.Date_debut + ' ' + ep.suivi.Heure_debut;
  const root = document.getElementById('root');
  root.innerHTML = '';
  root.appendChild(el('<a href="#" id="back-liste" class="back-link">← ' + (justCreated ? 'Retour au menu' : 'Retour à la liste') + '</a>'));
  document.getElementById('back-liste').onclick = (e)=>{
    e.preventDefault();
    if(justCreated){ view='menu'; renderMenu(); } else { view='liste'; renderListe(); }
  };

  if(justCreated){
    root.appendChild(el('<div class="selected-episode-banner">Épisode ouvert. Tu peux continuer à le compléter maintenant, ou revenir plus tard via "Compléter un épisode".</div>'));
  }

  renderSectionContexte(root, ep);
  renderSectionSymptomes(root, ep);
  renderSectionPrise(root, ep, 1);
  renderSectionPrise(root, ep, 2);
  renderSectionSolutions(root, ep);
  renderSectionCloture(root, ep);
}

function sectionSaveButton(container, onSave){
  const saved = el('<div class="saved-flag">✓ Enregistré</div>');
  const err = el('<div class="error-box"></div>');
  const btn = el('<button class="submit-btn">Enregistrer</button>');
  btn.onclick = async () => {
    btn.disabled = true; btn.textContent = 'Enregistrement…';
    saved.classList.remove('show'); err.classList.remove('show');
    try{
      await onSave();
      saved.classList.add('show');
    }catch(e){
      err.textContent = 'Erreur : ' + e.message;
      err.classList.add('show');
    }
    btn.disabled = false; btn.textContent = 'Enregistrer';
  };
  container.appendChild(btn); container.appendChild(saved); container.appendChild(err);
}

function renderSectionContexte(root, ep){
  root.appendChild(el('<div class="section-title">Contexte de l\'épisode</div>'));
  const card = el('<div class="card"></div>');
  card.appendChild(el('<div class="question">Localisation de la douleur</div>'));
  const gridLocId = 'grid-loc-'+ep.suivi.ID_episode;
  card.appendChild(el(`<div class="checkbox-grid" id="${gridLocId}"></div>`));
  const currentLoc = (ep.suivi.Localisation_douleur || '').split(',').map(s=>s.trim()).filter(Boolean);
  const stateLoc = currentLoc.slice();

  card.appendChild(el('<div class="question" style="margin-top:16px;">Facteur déclencheur</div>'));
  const gridDeclId = 'grid-decl-'+ep.suivi.ID_episode;
  card.appendChild(el(`<div class="checkbox-grid" id="${gridDeclId}"></div>`));
  const currentDecl = (ep.suivi['Facteur_declencheur_princ.'] || '').split(',').map(s=>s.trim()).filter(Boolean);
  const stateDecl = currentDecl.slice();

  root.appendChild(card);
  buildCheckboxGrid(gridLocId, LOCALISATIONS, stateLoc);
  buildCheckboxGrid(gridDeclId, DECLENCHEURS, stateDecl);

  sectionSaveButton(card, async () => {
    const suivi = {};
    if(stateLoc.length) suivi['Localisation_douleur'] = stateLoc.join(', ');
    if(stateDecl.length) suivi['Facteur_declencheur_princ.'] = stateDecl.join(', ');
    if(!Object.keys(suivi).length) throw new Error('Sélectionne au moins un élément avant d\'enregistrer.');
    await postAction({ action:'update', id_episode: ep.suivi.ID_episode, suivi });
  });
}

function renderSectionSymptomes(root, ep){
  root.appendChild(el('<div class="section-title">Symptômes associés</div>'));
  const card = el('<div class="card"></div>');
  const gridId = 'grid-symp-'+ep.suivi.ID_episode;
  card.appendChild(el(`<div class="checkbox-grid" id="${gridId}"></div>`));
  root.appendChild(card);
  const stateObj = {};
  SYMPTOMES_FIELDS.forEach(f => stateObj[f.key] = ep.symptomes[f.key] === true || ep.symptomes[f.key] === 'TRUE' || ep.symptomes[f.key] === 'Vrai');
  buildSymptomesGrid(gridId, stateObj);

  sectionSaveButton(card, async () => {
    const payload = {};
    SYMPTOMES_FIELDS.forEach(f => payload[f.key] = !!stateObj[f.key]);
    await postAction({ action:'update', id_episode: ep.suivi.ID_episode, symptomes: payload });
  });
}

function renderSectionPrise(root, ep, n){
  const pfx = 'Prise_'+n+'_';
  const already = ep.suivi[pfx+'date'];
  root.appendChild(el(`<div class="section-title">Prise ${n} ${already?'<span class=\"filled-tag\">déjà renseignée — modifiable</span>':''}</div>`));
  const card = el('<div class="card"></div>');

  const dateVal = frToDateInput(ep.suivi[pfx+'date']) || new Date().toISOString().slice(0,10);
  const heureVal = ep.suivi[pfx+'heure'] || '';
  card.appendChild(el(`
    <div class="question">Date et heure de la prise</div>
    <div style="display:flex;gap:8px;margin-bottom:14px;">
      <input type="date" id="p${n}_date" value="${dateVal}" style="flex:1;"/>
      <input type="time" id="p${n}_heure" value="${heureVal}" style="flex:1;"/>
    </div>
  `));

  card.appendChild(el(`<div class="question">Médicament(s)</div>`));
  const medGridId = 'p'+n+'_med';
  card.appendChild(el(`<div class="checkbox-grid" id="${medGridId}"></div>`));
  const currentMed = (ep.suivi[pfx+'medicament'] || '').split(',').map(s=>s.trim()).filter(Boolean);
  const stateMed = currentMed.slice();

  card.appendChild(el(`<div class="question" style="margin-top:16px;">Efficacité ressentie</div>`));
  const effGridId = 'p'+n+'_eff';
  card.appendChild(el(`<div class="btn-group cols5" id="${effGridId}"></div>`));

  card.appendChild(el(`<div class="question" style="margin-top:16px;">Délai avant effet</div>`));
  const delaiGridId = 'p'+n+'_delai';
  card.appendChild(el(`<div class="btn-group cols3" id="${delaiGridId}"></div>`));

  card.appendChild(el(`<div class="question" style="margin-top:16px;">Catégorie d'efficacité</div>`));
  const catGridId = 'p'+n+'_cat';
  card.appendChild(el(`<div class="btn-group" id="${catGridId}" style="display:grid;gap:8px;"></div>`));

  card.appendChild(el(`<div class="question" style="margin-top:16px;">Intensité maximale de la douleur</div>`));
  const intGridId = 'p'+n+'_int';
  card.appendChild(el(`<div class="btn-group" id="${intGridId}" style="display:grid;gap:8px;"></div>`));

  root.appendChild(card);
  buildCheckboxGrid(medGridId, MEDICAMENTS, stateMed);

  let selEff = ep.suivi[pfx+'efficacite'] || null;
  buildButtonSelect(effGridId, EFFICACITE_PCT, selEff, v => selEff = v);

  let selDelai = ep.suivi[pfx+'delais_effet'] !== '' ? Number(ep.suivi[pfx+'delais_effet']) : null;
  buildButtonSelect(delaiGridId, DELAI_EFFET.map(d=>d.l), DELAI_EFFET.find(d=>d.v===selDelai)?.l, l => selDelai = DELAI_EFFET.find(d=>d.l===l).v);

  let selCat = ep.suivi['Effiicacite_'+n] || null;
  buildButtonSelect(catGridId, EFFICACITE_CATEGORIES, selCat, v => selCat = v, true);

  let selInt = ep.suivi['Intensite_max_'+n] !== '' ? Number(ep.suivi['Intensite_max_'+n]) : null;
  buildButtonSelect(intGridId, INTENSITE.map(i=>i.l), INTENSITE.find(i=>i.v===selInt)?.l, l => selInt = INTENSITE.find(i=>i.l===l).v, true);

  sectionSaveButton(card, async () => {
    const suivi = {};
    const dateV = document.getElementById('p'+n+'_date').value;
    const heureV = document.getElementById('p'+n+'_heure').value;
    if(dateV) suivi[pfx+'date'] = dateInputToFr(dateV);
    if(heureV) suivi[pfx+'heure'] = heureV;
    if(stateMed.length) suivi[pfx+'medicament'] = stateMed.join(', ');
    if(selEff !== null) suivi[pfx+'efficacite'] = selEff;
    if(selDelai !== null) suivi[pfx+'delais_effet'] = selDelai;
    if(selCat !== null) suivi['Effiicacite_'+n] = selCat;
    if(selInt !== null) suivi['Intensite_max_'+n] = selInt;
    if(!Object.keys(suivi).length) throw new Error('Renseigne au moins un champ avant d\'enregistrer.');
    await postAction({ action:'update', id_episode: ep.suivi.ID_episode, suivi });
  });
}

function buildButtonSelect(containerId, options, current, onChange, stacked){
  const container = document.getElementById(containerId);
  options.forEach(opt => {
    const isSel = opt === current;
    const btn = el(`<div class="btn-opt ${isSel?'selected':''}" style="${stacked?'text-align:left;':''}">${opt}</div>`);
    btn.onclick = () => {
      container.querySelectorAll('.btn-opt').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      onChange(opt);
    };
    container.appendChild(btn);
  });
}

function renderSectionSolutions(root, ep){
  root.appendChild(el('<div class="section-title">Solutions mises en place</div>'));
  const card = el('<div class="card"></div>');
  const gridId = 'grid-sol-'+ep.suivi.ID_episode;
  card.appendChild(el(`<div class="checkbox-grid" id="${gridId}"></div>`));
  root.appendChild(card);
  const stateObj = {};
  SOLUTIONS_FIELDS.forEach(f => stateObj[f.key] = ep.solutions[f.key] === true || ep.solutions[f.key] === 'TRUE' || ep.solutions[f.key] === 'Vrai');
  const grid = document.getElementById(gridId);
  SOLUTIONS_FIELDS.forEach(f => {
    const checked = !!stateObj[f.key];
    const item = el(`
      <label class="checkbox-item ${checked?'checked':''}">
        <input type="checkbox" ${checked?'checked':''}/>
        <div class="checkbox-box"><span class="checkbox-check">✓</span></div>
        <span class="checkbox-label">${f.label}</span>
      </label>
    `);
    item.onclick = () => {
      setTimeout(()=>{
        const input = item.querySelector('input');
        item.classList.toggle('checked', input.checked);
        stateObj[f.key] = input.checked;
      },0);
    };
    grid.appendChild(item);
  });

  sectionSaveButton(card, async () => {
    const payload = {};
    SOLUTIONS_FIELDS.forEach(f => payload[f.key] = !!stateObj[f.key]);
    await postAction({ action:'update', id_episode: ep.suivi.ID_episode, solutions: payload });
  });
}

function renderSectionCloture(root, ep){
  root.appendChild(el('<div class="section-title">Clôture de l\'épisode</div>'));
  const card = el('<div class="card"></div>');
  const dateVal = frToDateInput(ep.suivi.Date_fin) || new Date().toISOString().slice(0,10);
  const heureVal = ep.suivi.Heure_fin || '';
  card.appendChild(el(`
    <div class="question">Fin de l'épisode</div>
    <div class="sublabel">La durée sera recalculée automatiquement.</div>
    <div style="display:flex;gap:8px;">
      <input type="date" id="fin_date" value="${dateVal}" style="flex:1;"/>
      <input type="time" id="fin_heure" value="${heureVal}" style="flex:1;"/>
    </div>
  `));
  root.appendChild(card);

  sectionSaveButton(card, async () => {
    const dateV = document.getElementById('fin_date').value;
    const heureV = document.getElementById('fin_heure').value;
    const suivi = {};
    if(dateV) suivi['Date_fin'] = dateInputToFr(dateV);
    if(heureV) suivi['Heure_fin'] = heureV;
    if(!Object.keys(suivi).length) throw new Error('Renseigne au moins la date ou l\'heure de fin.');
    await postAction({ action:'update', id_episode: ep.suivi.ID_episode, suivi });
  });
}

/* ===================== INIT ===================== */
renderMenu();
</script>
