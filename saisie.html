<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saisie — Suivi RGO / EoE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0f1117;color:#fff;font-family:'DM Sans',sans-serif;min-height:100vh;padding:0 0 60px;}
.header{background:#0d1629;padding:20px 20px 16px;margin-bottom:8px;}
.header-title{font-size:18px;font-weight:500;color:#fff;}
.header-sub{font-size:12px;color:#82B2C0aa;margin-top:3px;}
.back-link{font-size:13px;color:#82B2C088;text-decoration:none;display:inline-block;margin-top:4px;}
.back-link:hover{color:#82B2C0;}
.form{max-width:480px;margin:0 auto;padding:0 16px;}
.card{background:#1a1e2e;border:0.5px solid #ffffff08;border-radius:12px;padding:18px 16px;margin-bottom:8px;}
.question{font-size:14px;color:#fff;font-weight:500;margin-bottom:12px;line-height:1.4;}
.question span{color:#82B2C0;}
.sublabel{font-size:12px;color:#555;margin-bottom:8px;}
input[type="time"],input[type="date"],input[type="number"],input[type="text"]{background:#0f1117;border:0.5px solid #ffffff15;border-radius:8px;padding:10px 14px;font-size:15px;color:#fff;width:100%;outline:none;font-family:'DM Sans',sans-serif;-webkit-appearance:none;}
select{background:#0f1117;border:0.5px solid #ffffff15;border-radius:8px;padding:10px 14px;font-size:15px;color:#fff;width:100%;outline:none;font-family:'DM Sans',sans-serif;-webkit-appearance:none;}
input:focus,select:focus{border-color:#82B2C066;}
input[type="number"]{-moz-appearance:textfield;}
input[type="number"]::-webkit-outer-spin-button,input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn-group{display:grid;gap:8px;}
.btn-group.cols2{grid-template-columns:1fr 1fr;}
.btn-opt{background:#0f1117;border:0.5px solid #ffffff15;border-radius:8px;padding:10px 8px;font-size:12px;color:#aaa;cursor:pointer;text-align:center;transition:all 0.15s;font-family:'DM Sans',sans-serif;}
.btn-opt.selected{background:#0a2535;border-color:#82B2C0;color:#C3DEDD;}
.checkbox-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.checkbox-item{display:flex;align-items:center;gap:10px;background:#0f1117;border:0.5px solid #ffffff15;border-radius:8px;padding:10px 12px;cursor:pointer;transition:all 0.15s;}
.checkbox-item.checked{background:#0a2535;border-color:#82B2C0;}
.checkbox-item input{display:none;}
.checkbox-box{width:18px;height:18px;border-radius:4px;border:1.5px solid #333;background:#0f1117;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.15s;}
.checkbox-item.checked .checkbox-box{background:#82B2C0;border-color:#82B2C0;}
.checkbox-check{color:#0d1629;font-size:12px;font-weight:700;display:none;}
.checkbox-item.checked .checkbox-check{display:block;}
.checkbox-label{font-size:13px;color:#aaa;}
.checkbox-item.checked .checkbox-label{color:#C3DEDD;}
.range-wrap{display:flex;align-items:center;gap:12px;}
input[type="range"]{flex:1;-webkit-appearance:none;height:4px;background:#1e2235;border-radius:2px;outline:none;}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#82B2C0;cursor:pointer;}
.range-val{font-family:'DM Mono',monospace;font-size:18px;font-weight:500;color:#82B2C0;min-width:34px;text-align:right;}
.submit-btn{background:#82B2C0;border:none;border-radius:10px;padding:14px;font-size:14px;font-weight:500;color:#0d1629;width:100%;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:6px;transition:background 0.2s;}
.submit-btn:hover{background:#6fa0af;}
.submit-btn:disabled{background:#333;color:#666;cursor:not-allowed;}
.saved-flag{font-size:11px;color:#8FBF7A;margin-top:6px;display:none;}
.saved-flag.show{display:block;}
.error-box{background:#2a1010;border:0.5px solid #D85A3044;border-radius:10px;padding:12px 14px;font-size:13px;color:#F09595;margin-top:8px;display:none;}
.error-box.show{display:block;}
.type-toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.type-btn{border-radius:12px;padding:18px 12px;text-align:center;cursor:pointer;border:0.5px solid #ffffff10;background:#1a1e2e;transition:all 0.15s;}
.type-btn .tt{font-size:15px;font-weight:500;color:#fff;}
.type-btn .ts{font-size:11px;color:#666;margin-top:3px;}
.type-btn.active{background:#0a2535;border-color:#82B2C0;}
.type-btn.active .tt{color:#C3DEDD;}
#eoe-fields,#rgo-fields{display:none;}
.success-box{background:#0d1629;border:0.5px solid #8FBF7A44;border-radius:12px;padding:20px;text-align:center;display:none;}
.success-box.show{display:block;}
.success-title{font-size:16px;font-weight:500;color:#8FBF7A;margin-bottom:6px;}
.success-sub{font-size:13px;color:#82B2C0aa;}
</style>
</head>
<body>

<div class="header">
  <a href="index_gastro.html" class="back-link">← Retour au dashboard</a>
  <div class="header-title">Suivi RGO / EoE</div>
  <div class="header-sub" id="page-sub"></div>
</div>

<div class="form" id="root"></div>

<script>
/* ===================== CONFIGURATION ===================== */
// À remplacer par l'URL de la Web App Apps Script déployée POUR CE classeur
// (script distinct de celui du suivi migraines — voir Code.gs fourni séparément)
const SCRIPT_URL = 'REMPLACER_PAR_URL_APPS_SCRIPT_GASTRO';

const SYMPTOMES_EOE = ['Sensation de nourriture bloquée','Douleur','Brûlure','Toux ou étouffement'];
const GAVISCON_EFFICACITE = ['Bon','Partiel','Insuffisant','Insatisfaisant'];
const TYPE_DOULEUR = ['Constante','Pics','Constante avec pics','NA'];
const GENE_DEGLUTITION = ['Aucune','Légère','Modérée','Sévère'];

let currentType = 'RGO';
let symptEoeState = [];

function todayInput(){ return new Date().toISOString().slice(0,10); }
function nowStr(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function dateInputToFr(v){ if(!v) return ''; const p=v.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }

function buildButtonSelect(containerId, options, current, onChange){
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  options.forEach(opt => {
    const isSel = opt === current;
    const btn = el(`<div class="btn-opt ${isSel?'selected':''}">${opt}</div>`);
    btn.onclick = () => {
      container.querySelectorAll('.btn-opt').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      onChange(opt);
    };
    container.appendChild(btn);
  });
}

function render(){
  document.getElementById('page-sub').textContent = "Nouvel épisode — " + new Date().toLocaleDateString('fr-FR');
  const root = document.getElementById('root');
  root.innerHTML = '';

  // Sélecteur de type
  const toggle = el(`
    <div class="type-toggle">
      <div class="type-btn ${currentType==='RGO'?'active':''}" id="type-rgo-btn">
        <div class="tt">Remontée acide</div><div class="ts">RGO</div>
      </div>
      <div class="type-btn ${currentType==='EoE'?'active':''}" id="type-eoe-btn">
        <div class="tt">Crise de déglutition</div><div class="ts">EoE</div>
      </div>
    </div>
  `);
  root.appendChild(toggle);
  toggle.querySelector('#type-rgo-btn').onclick = () => { currentType='RGO'; render(); };
  toggle.querySelector('#type-eoe-btn').onclick = () => { currentType='EoE'; render(); };

  // Date / heure de début
  root.appendChild(el(`
    <div class="card">
      <div class="question">Début de l'épisode</div>
      <div class="row2">
        <input type="date" id="f_date" value="${todayInput()}"/>
        <input type="time" id="f_heure" value="${nowStr()}"/>
      </div>
    </div>
  `));

  // Durée
  root.appendChild(el(`
    <div class="card">
      <div class="question">Durée <span>(en heures, ex : 1.5 pour 1h30 — laisser vide si non déterminée)</span></div>
      <input type="number" id="f_duree" placeholder="ex : 3" min="0" step="0.25"/>
    </div>
  `));

  // Intensité
  root.appendChild(el(`
    <div class="card">
      <div class="question">Intensité ressentie <span>(0 à 10)</span></div>
      <div class="range-wrap">
        <input type="range" id="f_intensite" min="0" max="10" step="1" value="5"/>
        <div class="range-val" id="f_intensite_val">5</div>
      </div>
    </div>
  `));
  document.getElementById('f_intensite').oninput = (e) => { document.getElementById('f_intensite_val').textContent = e.target.value; };

  if(currentType === 'RGO'){
    root.appendChild(el(`
      <div class="card">
        <div class="question">Repas ou aliment précédent</div>
        <input type="text" id="f_repas" placeholder="ex : croissant + café"/>
      </div>
    `));
    root.appendChild(el(`
      <div class="card">
        <div class="question">Délai d'apparition depuis le repas <span>(en heures, ex : 0.5 pour 20 min)</span></div>
        <input type="number" id="f_delai" placeholder="ex : 4" min="0" step="0.25"/>
      </div>
    `));
    root.appendChild(el(`
      <div class="card">
        <div class="question">Gaviscon pris ?</div>
        <div class="btn-group cols2" id="grid-gaviscon"></div>
      </div>
    `));
    let gavPris = 'Non';
    buildButtonSelect('grid-gaviscon', ['Oui','Non'], gavPris, v => { gavPris = v; document.getElementById('gav-detail-wrap').style.display = v==='Oui' ? 'block' : 'none'; });

    const gavWrap = el(`<div id="gav-detail-wrap" style="display:none;"></div>`);
    gavWrap.appendChild(el(`
      <div class="card">
        <div class="question">Combien de prises ?</div>
        <input type="number" id="f_gav_combien" placeholder="ex : 1" min="0" step="1"/>
      </div>
    `));
    gavWrap.appendChild(el(`
      <div class="card">
        <div class="question">Efficacité du Gaviscon</div>
        <div class="btn-group" id="grid-gav-eff" style="display:grid;gap:8px;"></div>
      </div>
    `));
    root.appendChild(gavWrap);
    let gavEff = null;
    buildButtonSelect('grid-gav-eff', GAVISCON_EFFICACITE, gavEff, v => gavEff = v);

    root._getPayload = () => ({
      type: 'RGO',
      repas: document.getElementById('f_repas').value,
      delai: document.getElementById('f_delai').value,
      gaviscon_pris: gavPris,
      gaviscon_combien: gavPris==='Oui' ? document.getElementById('f_gav_combien').value : '',
      gaviscon_efficacite: gavPris==='Oui' ? (gavEff||'') : ''
    });
  } else {
    root.appendChild(el(`
      <div class="card">
        <div class="question">Localisation précise</div>
        <input type="text" id="f_localisation" placeholder="ex : gorge, œsophage, épigastre"/>
      </div>
    `));
    root.appendChild(el(`
      <div class="card">
        <div class="question">Symptômes ressentis</div>
        <div class="checkbox-grid" id="grid-sympt"></div>
        <div style="margin-top:8px;"><input type="text" id="f_sympt_autre" placeholder="Autre symptôme (facultatif)"/></div>
      </div>
    `));
    symptEoeState = [];
    const grid = document.getElementById('grid-sympt');
    SYMPTOMES_EOE.forEach(s => {
      const item = el(`
        <label class="checkbox-item">
          <input type="checkbox"/>
          <div class="checkbox-box"><span class="checkbox-check">✓</span></div>
          <span class="checkbox-label">${s}</span>
        </label>
      `);
      item.onclick = () => {
        setTimeout(()=>{
          const input = item.querySelector('input');
          item.classList.toggle('checked', input.checked);
          const idx = symptEoeState.indexOf(s);
          if(input.checked && idx===-1) symptEoeState.push(s);
          if(!input.checked && idx!==-1) symptEoeState.splice(idx,1);
        },0);
      };
      grid.appendChild(item);
    });

    root.appendChild(el(`
      <div class="card">
        <div class="question">Type de douleur</div>
        <div class="btn-group" id="grid-type-douleur" style="display:grid;gap:8px;"></div>
      </div>
    `));
    let typeDouleur = null;
    buildButtonSelect('grid-type-douleur', TYPE_DOULEUR, typeDouleur, v => typeDouleur = v);

    root.appendChild(el(`
      <div class="card">
        <div class="question">Aliments des 24-48h précédentes</div>
        <input type="text" id="f_aliments" placeholder="ex : curry au lait de coco la veille au soir"/>
      </div>
    `));

    root.appendChild(el(`
      <div class="card">
        <div class="question">Kiwi ou coco présent parmi ces aliments ?</div>
        <div class="btn-group cols2" id="grid-kiwi"></div>
        <div id="kiwi-detail-wrap" style="display:none;margin-top:8px;"><input type="text" id="f_kiwi_detail" placeholder="lequel ? (ex : lait de coco)"/></div>
      </div>
    `));
    let kiwiCoco = 'Non';
    buildButtonSelect('grid-kiwi', ['Oui','Non'], kiwiCoco, v => { kiwiCoco = v; document.getElementById('kiwi-detail-wrap').style.display = v==='Oui' ? 'block' : 'none'; });

    root.appendChild(el(`
      <div class="card">
        <div class="question">Gêne à la déglutition</div>
        <div class="btn-group" id="grid-gene" style="display:grid;gap:8px;"></div>
      </div>
    `));
    let geneDeglutition = null;
    buildButtonSelect('grid-gene', GENE_DEGLUTITION, geneDeglutition, v => geneDeglutition = v);

    root._getPayload = () => ({
      type: 'EoE',
      localisation: document.getElementById('f_localisation').value,
      symptomes: [...symptEoeState, document.getElementById('f_sympt_autre').value].filter(Boolean).join(', '),
      type_douleur: typeDouleur || '',
      aliments: document.getElementById('f_aliments').value,
      kiwi_coco: kiwiCoco==='Oui' ? ('Oui'+(document.getElementById('f_kiwi_detail').value ? ' ('+document.getElementById('f_kiwi_detail').value+')' : '')) : 'Non',
      gene_deglutition: geneDeglutition || ''
    });
  }

  root.appendChild(el(`
    <div class="card">
      <div class="question">Remarques</div>
      <input type="text" id="f_remarques" placeholder="ex : amélioré après 2h, sans rien prendre"/>
    </div>
  `));

  const btn = el('<button class="submit-btn">Enregistrer l\'épisode</button>');
  const errBox = el('<div class="error-box"></div>');
  const successBox = el(`<div class="success-box"><div class="success-title">Épisode enregistré !</div><div class="success-sub">Les données ont bien été ajoutées au suivi.</div></div>`);
  root.appendChild(btn); root.appendChild(errBox); root.appendChild(successBox);

  btn.onclick = async () => {
    btn.disabled = true; btn.textContent = 'Enregistrement…';
    errBox.classList.remove('show');
    try{
      const dateV = document.getElementById('f_date').value;
      const heureV = document.getElementById('f_heure').value;
      const dureeV = document.getElementById('f_duree').value;
      const intensiteV = document.getElementById('f_intensite').value;
      const remarquesV = document.getElementById('f_remarques').value;

      const payload = Object.assign({
        date: dateInputToFr(dateV),
        heure_debut: heureV,
        duree: dureeV,
        intensite: intensiteV,
        remarques: remarquesV
      }, root._getPayload());

      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify(payload)
      });

      successBox.classList.add('show');
      btn.style.display = 'none';
    } catch(err){
      errBox.textContent = 'Erreur : ' + err.message;
      errBox.classList.add('show');
      btn.disabled = false; btn.textContent = "Enregistrer l'épisode";
    }
  };
}

render();
</script>
</body>
</html>
