<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap');

.app{max-width:1100px;margin:0 auto;padding:0 24px 60px;}

.cover{background:#1a0d29;padding:20px 24px 18px;border-radius:0 0 20px 20px;}
.cover-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;}
.mol{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:3px;color:#C39CC055;margin-bottom:5px;}

.cover-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px;}

.refresh-btn:hover{border-color:#C39CC0;color:#C39CC0;}
.tabs-wrap{background:#161920;border-bottom:0.5px solid #2a2d35;margin-bottom:24px;}
.tabs{display:flex;padding:0;}

@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr;}}

.kcard{border-radius:12px;padding:16px 18px;margin-bottom:14px;}
.kcard.p{background:#1e1030;border-left:3px solid #C39CC0;}
.kcard.o{background:#2a1a10;border-left:3px solid #F6C7B3;}
.kcard.g{background:#162010;border-left:3px solid #8FBF7A;}
.klabel{font-size:12px;color:#a8adc0;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px;}
.kval{font-family:'DM Mono',monospace;font-size:32px;font-weight:500;}
.kval.p{color:#C39CC0;}.kval.o{color:#F6C7B3;}.kval.g{color:#8FBF7A;}
.ksub{font-size:12px;color:#555;margin-top:5px;}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.bar-name{font-size:13px;color:#888;width:160px;flex-shrink:0;}

.divider{border:none;border-top:0.5px solid #1e2235;margin:8px 0 24px;}

.insight{font-size:13px;color:#666;margin-top:10px;padding-top:10px;border-top:0.5px solid #2a2d35;line-height:1.6;}
.fab{position:fixed;bottom:24px;right:24px;background:#C39CC0;color:#1a0d29;border:none;border-radius:50px;padding:14px 20px;font-size:14px;font-weight:500;box-shadow:0 4px 20px rgba(0,0,0,0.4);cursor:pointer;font-family:'DM Sans',sans-serif;text-decoration:none;display:inline-block;}
.journal-item{background:#161920;border:0.5px solid #2a2d35;border-left:3px solid #6b7080;border-radius:0 10px 10px 0;padding:14px 16px;margin-bottom:10px;}
.journal-item.rgo{border-left-color:#D4A060;}
.journal-item.eoe{border-left-color:#C97B84;}
.journal-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
.journal-date{font-size:13px;color:#ccc;font-weight:500;}
.journal-int{font-family:'DM Mono',monospace;font-size:13px;font-weight:600;}
.journal-body{font-size:13px;color:#888;line-height:1.6;}
.journal-body b{color:#aaa;font-weight:500;}
.type-pill{font-size:10px;padding:2px 8px;border-radius:6px;font-weight:500;}
.type-pill.rgo{background:#2a1a08;color:#D4A060;}
.type-pill.eoe{background:#2a121a;color:#C97B84;}
</style>

<body>
<div id="root"></div>
<a href="saisie_gastro.html" class="fab">+ Saisie</a>
<script>
const gc='rgba(255,255,255,0.04)';const tc='#555';
let charts=[];let rawRGO=[];let rawEoE=[];let currentTab='overview';
const MOIS=['jan.','fev.','mar.','avr.','mai','juin','juil.','aout','sep.','oct.','nov.','dec.'];

/* ===================== CONFIGURATION =====================
   ATTENTION : la fonction Netlify "sheets" utilisée par le dashboard migraines
   a très probablement l'ID du classeur MPH codé en dur côté serveur (le fetch
   ne transmet qu'un paramètre "sheet", jamais d'ID de classeur). Pour que CE
   dashboard lise le bon classeur (suivi_symptomes_EoE_RGO), il faut soit :
   - rendre la fonction Netlify existante paramétrable via ?spreadsheetId=...
   - soit créer une fonction dédiée (ex: sheets-gastro.js) pointant sur ce classeur
   Le fetch ci-dessous transmet spreadsheetId ; adapte l'URL si ta fonction
   utilise un autre nom de paramètre ou un endpoint séparé. */
const WORKER_URL = '/.netlify/functions/sheets';
const SHEET_ID = 'REMPLACER_PAR_ID_DU_CLASSEUR_GASTRO';
/* =========================================================== */

function mkChart(id,cfg){const el=document.getElementById(id);if(!el)return;const c=new Chart(el,cfg);charts.push(c);return c;}
function destroyCharts(){charts.forEach(c=>{try{c.destroy();}catch(e){}});charts=[];}
function parseNum(v){if(v==null||v==='')return null;const n=parseFloat(v.toString().replace(',','.'));return isNaN(n)?null:n;}
function avg(arr){const v=arr.filter(x=>x!=null&&!isNaN(x));return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;}
function parseDateStr(str){if(!str)return null;const p=str.split('/');if(p.length<3)return null;return new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]));}
function formatDate(str){if(!str)return '--';const p=str.split('/');if(p.length<3)return str;return parseInt(p[0])+' '+MOIS[parseInt(p[1])-1]+' '+p[2];}
function splitMulti(str){if(!str)return[];return str.split(',').map(s=>s.trim()).filter(Boolean);}
function isOui(v){if(!v)return false;return v.toString().trim().toLowerCase().startsWith('oui');}

// Tolère les anciennes saisies en texte libre ("3h", "20 min", "3h30", "Non renseignée")
// autant que les nouvelles saisies en heures décimales ("1.5") venant du formulaire.
function parseDureeH(str){
  if(str==null||str==='')return null;
  const s=str.toString().trim().toLowerCase();
  if(!s||s.includes('non renseign'))return null;
  if(/^[0-9]+([.,][0-9]+)?$/.test(s))return parseFloat(s.replace(',','.'));
  let m=s.match(/^([0-9]+)h([0-9]{1,2})?$/);
  if(m)return parseInt(m[1])+(m[2]?parseInt(m[2])/60:0);
  m=s.match(/^([0-9]+)\s*min$/);
  if(m)return parseInt(m[1])/60;
  m=s.match(/^([0-9]+)h\s*([0-9]+)\s*min$/);
  if(m)return parseInt(m[1])+parseInt(m[2])/60;
  return null;
}

// Catégorise les libellés d'efficacité Gaviscon, qu'ils viennent du nouveau formulaire
// (valeurs propres : Bon/Partiel/Insuffisant/Insatisfaisant) ou d'anciennes saisies
// libres ("Partielle, revient 1h après").
function categEfficaciteGaviscon(str){
  if(!str)return null;
  const s=str.toString().toLowerCase();
  if(s.includes('insatisfaisant'))return 'Insatisfaisant';
  if(s.includes('insuffisant'))return 'Insuffisant';
  if(s.includes('partiel'))return 'Partiel';
  if(s.includes('bon'))return 'Bon';
  return 'Autre';
}

function categGeneDeglutition(str){
  if(!str)return null;
  const s=str.toString().toLowerCase();
  if(s.includes('sévère')||s.includes('severe'))return 'Sévère';
  if(s.includes('modérée')||s.includes('moderee'))return 'Modérée';
  if(s.includes('légère')||s.includes('legere'))return 'Légère';
  if(s.startsWith('non')||s.includes('aucune'))return 'Aucune';
  if(s.startsWith('oui'))return 'Présente (non précisée)';
  return null;
}

async function fetchSheet(sheetName){
  const url=WORKER_URL+'?sheet='+encodeURIComponent(sheetName)+'&spreadsheetId='+encodeURIComponent(SHEET_ID);
  const r=await fetch(url);
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error((e.error&&e.error.message)||'Erreur '+r.status);}
  const d=await r.json();
  if(d.error) throw new Error(d.error.message||'Erreur de lecture');
  if(!d.values||d.values.length<2)return[];
  const[headers,...rows]=d.values;
  return rows.map(row=>{const o={};headers.forEach((h,i)=>o[h.trim()]=row[i]||'');return o;});
}

async function startWithKey(){
  document.getElementById('root').innerHTML='<div class="loading"><div class="spinner"></div><div class="load-text">Connexion à Google Sheets…</div></div>';
  try{
    [rawRGO,rawEoE]=await Promise.all([fetchSheet('Remontées acides (RGO)'),fetchSheet('Crises EoE')]);
    renderDashboard();
  }catch(e){
    document.getElementById('root').innerHTML='<div style="padding:40px 24px;"><div class="error-box">Impossible de charger les données.<br><br>'+e.message+'<br><br><button onclick="startWithKey()" style="margin-top:12px;background:#C39CC0;border:none;border-radius:8px;padding:10px 20px;color:#1a0d29;cursor:pointer;font-size:13px;">Réessayer</button></div></div>';
  }
}

function countByCategory(items,fieldExtractor){
  const m={};
  items.forEach(it=>{const vals=fieldExtractor(it);vals.forEach(v=>{if(v)m[v]=(m[v]||0)+1;});});
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}

function renderDashboard(){
  destroyCharts();

  const rgo = rawRGO.filter(r=>r.Date).sort((a,b)=>parseDateStr(a.Date)-parseDateStr(b.Date));
  const eoe = rawEoE.filter(r=>r['Date début']).sort((a,b)=>parseDateStr(a['Date début'])-parseDateStr(b['Date début']));

  const rgoInt = rgo.map(r=>parseNum(r['Intensité (0-10)'])).filter(v=>v!=null);
  const eoeInt = eoe.map(r=>parseNum(r['Intensité (0-10)'])).filter(v=>v!=null);
  const avgRgoInt = avg(rgoInt), avgEoeInt = avg(eoeInt);

  const allDates = [...rgo.map(r=>parseDateStr(r.Date)), ...eoe.map(r=>parseDateStr(r['Date début']))].filter(Boolean);
  const lastDate = allDates.length ? new Date(Math.max(...allDates)) : null;
  const nTotal = rgo.length + eoe.length;

  const palette=['#D4A060','#C97B84','#8FBF7A','#82B2C0','#DCECE9','#E08070'];

  // ---- Vue d'ensemble : journal combiné + aliments fréquents ----
  const journalAll = [
    ...rgo.map(r=>({kind:'RGO',d:parseDateStr(r.Date),date:r.Date,heure:r['Heure de début'],int:parseNum(r['Intensité (0-10)']),raw:r})),
    ...eoe.map(r=>({kind:'EoE',d:parseDateStr(r['Date début']),date:r['Date début'],heure:r['Heure de début'],int:parseNum(r['Intensité (0-10)']),raw:r}))
  ].filter(x=>x.d).sort((a,b)=>b.d-a.d);

  const alimentsRGO = countByCategory(rgo, r=>splitMulti(r['Repas / aliment précédent']));
  const alimentsEoE = countByCategory(eoe, r=>splitMulti(r['Aliments 24-48h avant']));
  const alimentsAll = {};
  [...alimentsRGO, ...alimentsEoE].forEach(([nom,cnt])=>{ alimentsAll[nom]=(alimentsAll[nom]||0)+cnt; });
  const alimentsCounts = Object.entries(alimentsAll).sort((a,b)=>b[1]-a[1]);

  let pageContent='';

  if(currentTab==='overview'){
    pageContent=
'<div class="disclaimer">Échantillon encore très restreint ('+nTotal+' épisodes au total). Les tendances ci-dessous sont indicatives et à confirmer avec davantage de données — évite d\'en tirer des conclusions fermes pour le moment.</div>'+
'<div class="sec"><div class="slabel">Vue d\'ensemble</div>'+
'<div class="grid3">'+
'<div class="mini"><div class="mini-l">Remontées acides (RGO)</div><div class="mini-v" style="color:#D4A060;">'+rgo.length+'</div></div>'+
'<div class="mini"><div class="mini-l">Crises de déglutition (EoE)</div><div class="mini-v" style="color:#C97B84;">'+eoe.length+'</div></div>'+
'<div class="mini"><div class="mini-l">Dernier épisode</div><div class="mini-v" style="color:#82B2C0;font-size:15px;">'+(lastDate?formatDate([lastDate.getDate(),lastDate.getMonth()+1,lastDate.getFullYear()].join('/')):'--')+'</div></div>'+
'</div></div>'+
'<div class="divider"></div>'+
'<div class="sec"><div class="slabel">Journal (tous types)</div>'+
(journalAll.length ? journalAll.map(j=>{
  const r=j.raw;
  let detail='';
  if(j.kind==='RGO'){
    detail = (r['Repas / aliment précédent']?'<b>Repas :</b> '+r['Repas / aliment précédent']+'<br>':'') +
             (r['Gaviscon pris ?']?'<b>Gaviscon :</b> '+r['Gaviscon pris ?']+(r['Efficacité Gaviscon']?' — '+r['Efficacité Gaviscon']:'')+'<br>':'') +
             (r.Remarques?'<b>Remarques :</b> '+r.Remarques:'');
  } else {
    detail = (r['Localisation précise']?'<b>Localisation :</b> '+r['Localisation précise']+'<br>':'') +
             (r['Symptômes']?'<b>Symptômes :</b> '+r['Symptômes']+'<br>':'') +
             (r['Gêne à la déglutition ?']?'<b>Déglutition :</b> '+r['Gêne à la déglutition ?']+'<br>':'') +
             (r.Remarques?'<b>Remarques :</b> '+r.Remarques:'');
  }
  return '<div class="journal-item '+(j.kind==='RGO'?'rgo':'eoe')+'"><div class="journal-head"><div class="journal-date"><span class="type-pill '+(j.kind==='RGO'?'rgo':'eoe')+'">'+j.kind+'</span>&nbsp; '+formatDate(j.date)+(j.heure?' · '+j.heure:'')+'</div>'+(j.int!=null?'<div class="journal-int" style="color:'+(j.kind==='RGO'?'#D4A060':'#C97B84')+';">'+j.int+'/10</div>':'')+'</div>'+(detail?'<div class="journal-body">'+detail+'</div>':'')+'</div>';
}).join('') : '<div class="no-data">Aucun épisode enregistré pour l\'instant.</div>')+
'</div>'+
'<div class="divider"></div>'+
'<div class="sec"><div class="slabel">Aliments associés aux épisodes (RGO + EoE)</div><div class="chart-card"><div class="ct">Fréquence de citation</div>'+(alimentsCounts.length?alimentsCounts.slice(0,10).map(([nom,cnt],i)=>'<div class="bar-row"><div class="bar-name">'+nom+'</div><div class="bar-track"><div class="bar-fill" style="width:'+Math.round(cnt/alimentsCounts[0][1]*100)+'%;background:'+palette[i%palette.length]+';"></div></div><div class="bar-v" style="color:'+palette[i%palette.length]+';">'+cnt+'</div></div>').join(''):'<div class="no-data">Aucune donnée</div>')+'<div class="insight">Ces aliments sont ceux mentionnés en texte libre dans les champs "repas précédent" (RGO) et "aliments 24-48h avant" (EoE) — un même aliment orthographié différemment sera compté séparément.</div></div></div>';

  } else if(currentTab==='rgo'){
    const efficaciteCounts = countByCategory(rgo, r=>{const c=categEfficaciteGaviscon(r['Efficacité Gaviscon']);return c?[c]:[];});
    const gaviscConsPris = rgo.filter(r=>isOui(r['Gaviscon pris ?'])).length;
    const durees = rgo.map(r=>parseDureeH(r.Durée)).filter(v=>v!=null);
    const avgDuree = avg(durees);
    const timelineData = rgo.filter(r=>r.Date&&parseNum(r['Intensité (0-10)'])!=null).map(r=>({x:formatDate(r.Date),y:parseNum(r['Intensité (0-10)'])}));

    pageContent=
'<div class="sec"><div class="slabel">Chiffres clés — RGO</div>'+
'<div class="kcard o"><div class="klabel">Remontées acides enregistrées</div><div class="kval o">'+rgo.length+'</div><div class="ksub">Intensité moyenne : '+(avgRgoInt!=null?avgRgoInt.toFixed(1).replace('.',','):'--')+' / 10'+(avgDuree!=null?' · durée moyenne : '+avgDuree.toFixed(1).replace('.',',')+'h':'')+'</div></div>'+
'<div class="chart-card"><div class="ct">Intensité au fil du temps</div><div style="position:relative;width:100%;height:180px;">'+(timelineData.length?'<canvas id="c_rgo_int"></canvas>':'<div class="no-data">Pas assez de données</div>')+'</div></div>'+
'</div>'+
'<div class="divider"></div>'+
'<div class="sec"><div class="slabel">Traitement</div><div class="grid2">'+
'<div class="chart-card"><div class="ct">Gaviscon</div><div class="mini" style="margin-bottom:10px;"><div class="mini-l">Prises</div><div class="mini-v" style="color:#D4A060;">'+gaviscConsPris+' / '+rgo.length+' épisodes</div></div>'+(efficaciteCounts.length?'<div class="bar-name" style="width:auto;margin-bottom:6px;color:#888;">Efficacité ressentie</div>'+efficaciteCounts.map(([nom,cnt],i)=>'<div class="bar-row"><div class="bar-name">'+nom+'</div><div class="bar-track"><div class="bar-fill" style="width:'+Math.round(cnt/efficaciteCounts[0][1]*100)+'%;background:'+palette[i%palette.length]+';"></div></div><div class="bar-v" style="color:'+palette[i%palette.length]+';">'+cnt+'</div></div>').join(''):'<div class="no-data">Aucune donnée</div>')+'</div>'+
'<div class="chart-card"><div class="ct">Aliments précédant l\'épisode</div>'+(alimentsRGO.length?alimentsRGO.slice(0,8).map(([nom,cnt],i)=>'<div class="bar-row"><div class="bar-name">'+nom+'</div><div class="bar-track"><div class="bar-fill" style="width:'+Math.round(cnt/alimentsRGO[0][1]*100)+'%;background:'+palette[i%palette.length]+';"></div></div><div class="bar-v" style="color:'+palette[i%palette.length]+';">'+cnt+'</div></div>').join(''):'<div class="no-data">Aucune donnée</div>')+'</div>'+
'</div></div>'+
'<div class="divider"></div>'+
'<div class="sec"><div class="slabel">Limites</div><div style="background:#1e1a10;border-left:3px solid #F0E2C3;border-radius:0 12px 12px 0;padding:14px 18px;"><p style="font-size:13px;color:rgba(240,226,195,0.73);line-height:2;">· Échantillon encore restreint ('+rgo.length+' épisodes) — aucune tendance statistique fiable ne peut en être tirée</p><p style="font-size:13px;color:rgba(240,226,195,0.73);line-height:2;">· Données auto-rapportées, biais de perception possible</p></div></div>';

  } else if(currentTab==='eoe'){
    const symptCounts = countByCategory(eoe, r=>splitMulti(r['Symptômes']));
    const geneCounts = countByCategory(eoe, r=>{const c=categGeneDeglutition(r['Gêne à la déglutition ?']);return c?[c]:[];});
    const kiwiOui = eoe.filter(r=>isOui(r['Kiwi ou coco présent ?'])).length;
    const timelineData = eoe.filter(r=>r['Date début']&&parseNum(r['Intensité (0-10)'])!=null).map(r=>({x:formatDate(r['Date début']),y:parseNum(r['Intensité (0-10)'])}));
    const typeDouleurCounts = countByCategory(eoe, r=>{const v=(r['Type douleur (constante/pics)']||'').trim();return v&&v.toUpperCase()!=='NA'?[v]:[];});

    pageContent=
'<div class="sec"><div class="slabel">Chiffres clés — EoE</div>'+
'<div class="kcard p"><div class="klabel">Crises de déglutition enregistrées</div><div class="kval p" style="color:#C97B84;">'+eoe.length+'</div><div class="ksub">Intensité moyenne : '+(avgEoeInt!=null?avgEoeInt.toFixed(1).replace('.',','):'--')+' / 10</div></div>'+
'<div class="chart-card"><div class="ct">Intensité au fil du temps</div><div style="position:relative;width:100%;height:180px;">'+(timelineData.length?'<canvas id="c_eoe_int"></canvas>':'<div class="no-data">Pas assez de données</div>')+'</div></div>'+
'</div>'+
'<div class="divider"></div>'+
'<div class="sec"><div class="slabel">Symptômes & déglutition</div><div class="grid2">'+
'<div class="chart-card"><div class="ct">Symptômes rapportés</div>'+(symptCounts.length?symptCounts.map(([nom,cnt],i)=>'<div class="bar-row"><div class="bar-name">'+nom+'</div><div class="bar-track"><div class="bar-fill" style="width:'+Math.round(cnt/symptCounts[0][1]*100)+'%;background:'+palette[i%palette.length]+';"></div></div><div class="bar-v" style="color:'+palette[i%palette.length]+';">'+cnt+'</div></div>').join(''):'<div class="no-data">Aucune donnée</div>')+'</div>'+
'<div class="chart-card"><div class="ct">Gêne à la déglutition</div>'+(geneCounts.length?geneCounts.map(([nom,cnt],i)=>'<div class="bar-row"><div class="bar-name">'+nom+'</div><div class="bar-track"><div class="bar-fill" style="width:'+Math.round(cnt/geneCounts[0][1]*100)+'%;background:'+palette[i%palette.length]+';"></div></div><div class="bar-v" style="color:'+palette[i%palette.length]+';">'+cnt+'</div></div>').join(''):'<div class="no-data">Aucune donnée</div>')+(typeDouleurCounts.length?'<div class="insight">Type de douleur — '+typeDouleurCounts.map(([n,c])=>n+' ('+c+')').join(', ')+'</div>':'')+'</div>'+
'</div></div>'+
'<div class="divider"></div>'+
'<div class="sec"><div class="slabel">Kiwi / coco</div><div class="chart-card"><div class="ct">Présence parmi les aliments des 24-48h précédentes</div>'+
'<div class="mini"><div class="mini-l">Crises avec kiwi ou coco identifié</div><div class="mini-v" style="color:#C97B84;">'+kiwiOui+' / '+eoe.length+'</div></div>'+
'<div class="insight">Sur un échantillon aussi restreint, cette proportion ne permet pas d\'établir un lien de causalité — elle sert uniquement de repère à surveiller au fil des prochaines saisies.</div>'+
'</div></div>'+
'<div class="divider"></div>'+
'<div class="sec"><div class="slabel">Aliments des 24-48h précédentes</div><div class="chart-card"><div class="ct">Fréquence de citation</div>'+(alimentsEoE.length?alimentsEoE.slice(0,8).map(([nom,cnt],i)=>'<div class="bar-row"><div class="bar-name">'+nom+'</div><div class="bar-track"><div class="bar-fill" style="width:'+Math.round(cnt/alimentsEoE[0][1]*100)+'%;background:'+palette[i%palette.length]+';"></div></div><div class="bar-v" style="color:'+palette[i%palette.length]+';">'+cnt+'</div></div>').join(''):'<div class="no-data">Aucune donnée</div>')+'</div></div>'+
'<div class="divider"></div>'+
'<div class="sec"><div class="slabel">Limites</div><div style="background:#1e1a10;border-left:3px solid #F0E2C3;border-radius:0 12px 12px 0;padding:14px 18px;"><p style="font-size:13px;color:rgba(240,226,195,0.73);line-height:2;">· Échantillon très restreint ('+eoe.length+' crises) — les proportions ci-dessus peuvent changer fortement avec plus de données</p><p style="font-size:13px;color:rgba(240,226,195,0.73);line-height:2;">· Données auto-rapportées, biais de perception possible</p></div></div>';
  }

  document.getElementById('root').innerHTML='<div class="app"><div class="cover"><div class="cover-top"><div><div class="mol">SUIVI · RGO / EOE</div><div class="ctitle">Suivi digestif</div><div class="csub">'+nTotal+' épisodes enregistrés</div></div><button class="refresh-btn" onclick="location.reload()">↺ Actualiser</button></div><div class="cover-kpis"><div class="ckpi"><div class="ckpi-v">'+rgo.length+'</div><div class="ckpi-l">Remontées (RGO)</div></div><div class="ckpi"><div class="ckpi-v">'+eoe.length+'</div><div class="ckpi-l">Crises (EoE)</div></div><div class="ckpi"><div class="ckpi-v">'+(avgRgoInt!=null?avgRgoInt.toFixed(1).replace('.',','):'--')+'</div><div class="ckpi-l">Intensité moy. RGO /10</div></div><div class="ckpi"><div class="ckpi-v">'+(avgEoeInt!=null?avgEoeInt.toFixed(1).replace('.',','):'--')+'</div><div class="ckpi-l">Intensité moy. EoE /10</div></div></div></div><div class="tabs-wrap"><div class="tabs"><button class="tab '+(currentTab==='overview'?'active':'')+'" onclick="switchTab(\'overview\')">Vue d\'ensemble</button><button class="tab '+(currentTab==='rgo'?'active':'')+'" onclick="switchTab(\'rgo\')">RGO</button><button class="tab '+(currentTab==='eoe'?'active':'')+'" onclick="switchTab(\'eoe\')">EoE</button></div></div><div id="page-content">'+pageContent+'</div></div>';

  if(currentTab==='rgo'){
    const timelineData = rgo.filter(r=>r.Date&&parseNum(r['Intensité (0-10)'])!=null).map(r=>({x:formatDate(r.Date),y:parseNum(r['Intensité (0-10)'])}));
    if(timelineData.length){
      mkChart('c_rgo_int',{type:'line',data:{labels:timelineData.map(p=>p.x),datasets:[{data:timelineData.map(p=>p.y),borderColor:'#D4A060',backgroundColor:'#D4A06022',pointBackgroundColor:'#D4A060',pointRadius:5,tension:0.2,fill:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:tc,font:{size:11}},grid:{color:gc}},y:{ticks:{color:tc,font:{size:12},stepSize:2},grid:{color:gc},min:0,max:10}}}});
    }
  } else if(currentTab==='eoe'){
    const timelineData = eoe.filter(r=>r['Date début']&&parseNum(r['Intensité (0-10)'])!=null).map(r=>({x:formatDate(r['Date début']),y:parseNum(r['Intensité (0-10)'])}));
    if(timelineData.length){
      mkChart('c_eoe_int',{type:'line',data:{labels:timelineData.map(p=>p.x),datasets:[{data:timelineData.map(p=>p.y),borderColor:'#C97B84',backgroundColor:'#C97B8422',pointBackgroundColor:'#C97B84',pointRadius:5,tension:0.2,fill:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:tc,font:{size:11}},grid:{color:gc}},y:{ticks:{color:tc,font:{size:12},stepSize:2},grid:{color:gc},min:0,max:10}}}});
    }
  }
}

function switchTab(tab){currentTab=tab;renderDashboard();}
startWithKey();
</script>
</body>
</html>
